# Legacy manual path; provision referenced Secrets before use. See docs/security/secrets-management.md.
apiVersion: v1
kind: Service
metadata:
  name: patronidemo-config-backup
  labels:
    application: patroni
    cluster-name: patronidemo
    type: backup
spec:
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patronidemo-backup
  labels:
    application: patroni
    cluster-name: patronidemo-backup
    type: backup
spec:
  replicas: 3
  serviceName: patronidemo-backup
  selector:
    matchLabels:
      application: patroni
      cluster-name: patronidemo-backup
      type: backup
  template:
    metadata:
      labels:
        application: patroni
        cluster-name: patronidemo-backup
        type: backup
    spec:
      serviceAccountName: patronidemo-backup
      initContainers:
      - name: wal-g
        image: dbaas/wal-g:3.0.7
        imagePullPolicy: Never
        volumeMounts:
        - name: wal-g-bin
          mountPath: /usr/local/bin
        command:
        - /bin/sh
        - -c
        args:
        - "cp wal-g-pg-ubuntu-20.04-amd64 /usr/local/bin/wal-g && cp -r /commands\
          \ /usr/local/bin/ && chmod +x /usr/local/bin/wal-g && chmod +x /usr/local/bin/commands/*.sh\
          \ \n"
      containers:
      - name: patronidemo-backup
        image: dbaas/patroni:2.1.0
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /readiness
            port: 8008
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        ports:
        - containerPort: 8008
          protocol: TCP
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - name: pgdata
          mountPath: /home/postgres/pgdata/pgroot/
        - name: wal-g-bin
          mountPath: /wal-g
        - name: wal-g-credentials
          mountPath: /wal-g-credentials
        env:
        - name: PATRONI_KUBERNETES_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PATRONI_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PATRONI_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PATRONI_KUBERNETES_BYPASS_API_SERVICE
          value: 'true'
        - name: PATRONI_KUBERNETES_USE_ENDPOINTS
          value: 'true'
        - name: PATRONI_KUBERNETES_LABELS
          value: '{application: patroni, cluster-name: patronidemo}'
        - name: PATRONI_SUPERUSER_USERNAME
          valueFrom:
            secretKeyRef:
              name: patroni-credentials
              key: superuser-username
        - name: PATRONI_SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: patroni-credentials
              key: superuser-password
        - name: PATRONI_REPLICATION_USERNAME
          valueFrom:
            secretKeyRef:
              name: patroni-credentials
              key: replication-username
        - name: PATRONI_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: patroni-credentials
              key: replication-password
        - name: PATRONI_SCOPE
          value: patronidemo-backup
        - name: PATRONI_POSTGRESQL_DATA_DIR
          value: /home/postgres/pgdata/pgroot/data
        - name: PATRONI_POSTGRESQL_PGPASS
          value: /tmp/pgpass
        - name: PATRONI_POSTGRESQL_LISTEN
          value: 0.0.0.0:5432
        - name: PATRONI_RESTAPI_LISTEN
          value: 0.0.0.0:8008
        - name: PATRONI_POSTGRESQL_PARAMETERS
          value: 'wal_level: replica

            archive_mode: on

            archive_timeout: 60

            archive_command: ''/wal-g/wal-g wal-push  --config /wal-g-credentials/.walg.env
            %p''

            restore_command: ''/wal-g/wal-g wal-fetch --config /wal-g-credentials/.walg.env
            %f %p''

            '
        - name: BACKUP_ENABLE
          value: 'true'
        - name: BASE_BACKUP_NAME
          value: latest
        - name: RECOVERY_TARGET_TIME
          value: '2025-06-08 09:06:45'
      terminationGracePeriodSeconds: 30
      volumes:
      - name: wal-g-bin
        emptyDir: {}
      - name: wal-g-credentials
        secret:
          secretName: wal-g-credentials
  volumeClaimTemplates:
  - metadata:
      labels:
        application: spilo
        spilo-cluster: patronidemo-backup
      annotations:
        volume.alpha.kubernetes.io/storage-class: anything
      name: pgdata
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patronidemo-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patronidemo-backup
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
  - delete
  - deletecollection
- apiGroups:
  - ''
  resources:
  - endpoints
  verbs:
  - get
  - patch
  - update
  - create
  - list
  - watch
  - delete
  - deletecollection
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patronidemo-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patronidemo-backup
subjects:
- kind: ServiceAccount
  name: patronidemo-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patroni-k8s-ep-access-backup
rules:
- apiGroups:
  - ''
  resources:
  - endpoints
  resourceNames:
  - kubernetes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: patroni-k8s-ep-access-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: patroni-k8s-ep-access-backup
subjects:
- kind: ServiceAccount
  name: patronidemo
  namespace: default
