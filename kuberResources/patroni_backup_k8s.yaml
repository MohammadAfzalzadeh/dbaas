# headless service to avoid deletion of patronidemo-config endpoint
apiVersion: v1
kind: Service
metadata:
  name: patronidemo-config-backup
  labels:
    application: patroni
    cluster-name: patronidemo
    type: backup
spec:
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: &cluster_name patronidemo-backup
  labels:
    application: patroni
    cluster-name: *cluster_name
    type: backup
spec:
  replicas: 3
  serviceName: *cluster_name
  selector:
    matchLabels:
      application: patroni
      cluster-name: *cluster_name
      type: backup
  template:
    metadata:
      labels:
        application: patroni
        cluster-name: *cluster_name
        type: backup
    spec:
      serviceAccountName: patronidemo-backup
      initContainers: 
      - name: wal-g
        image: wal-g
        imagePullPolicy: Never
        volumeMounts:
        - name: wal-g-bin
          mountPath: /usr/local/bin
        command: ["/bin/sh", "-c" ]
        args: 
        - | 
          cp wal-g-pg-ubuntu-20.04-amd64 /usr/local/bin/wal-g && cp -r /commands /usr/local/bin/ && chmod +x /usr/local/bin/wal-g && chmod +x /usr/local/bin/commands/*.sh 
      containers:
      - name: *cluster_name
        image: patroni  
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /readiness
            port: 8008
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        ports:
        - containerPort: 8008
          protocol: TCP
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - name: pgdata
          mountPath: /home/postgres/pgdata/pgroot/
        - name: wal-g-bin
          mountPath: /wal-g
        - name: wal-g-credentials
          mountPath: /wal-g-credentials
        env:
        - name: PATRONI_KUBERNETES_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PATRONI_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PATRONI_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        
        - name: PATRONI_KUBERNETES_BYPASS_API_SERVICE
          value: 'true'
        - name: PATRONI_KUBERNETES_USE_ENDPOINTS
          value: 'true'
        - name: PATRONI_KUBERNETES_LABELS
          value: '{application: patroni, cluster-name: patronidemo}'

        - name: PATRONI_SUPERUSER_USERNAME
          value: postgres
        - name: PATRONI_SUPERUSER_PASSWORD
          value: mmm
        - name: PATRONI_REPLICATION_USERNAME
          value: standby
        - name: PATRONI_REPLICATION_PASSWORD
          value: mmm
        - name: PATRONI_SCOPE
          value: *cluster_name
        
        - name: PATRONI_POSTGRESQL_DATA_DIR
          value: /home/postgres/pgdata/pgroot/data
        - name: PATRONI_POSTGRESQL_PGPASS
          value: /tmp/pgpass
        - name: PATRONI_POSTGRESQL_LISTEN
          value: '0.0.0.0:5432'
        - name: PATRONI_RESTAPI_LISTEN  
          value: '0.0.0.0:8008'

        # PostgreSQL archiving
        - name: PATRONI_POSTGRESQL_PARAMETERS
          value: |
            wal_level: replica
            archive_mode: on
            archive_timeout: 60
            archive_command: '/wal-g/wal-g wal-push  --config /wal-g-credentials/.walg.env %p'
            restore_command: '/wal-g/wal-g wal-fetch --config /wal-g-credentials/.walg.env %f %p'


        - name: BACKUP_ENABLE
          value: "true"
          
        - name: BASE_BACKUP_NAME
          value: "latest"

        - name: RECOVERY_TARGET_TIME
          value: '2025-06-08 09:06:45'

      terminationGracePeriodSeconds: 30
      volumes:
      - name: wal-g-bin
        emptyDir: {}
      - name: wal-g-credentials
        secret:
          secretName: wal-g-credentials
  volumeClaimTemplates:
  - metadata:
      labels:
        application: spilo
        spilo-cluster: *cluster_name
      annotations:
        volume.alpha.kubernetes.io/storage-class: anything
      name: pgdata
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patronidemo-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patronidemo-backup
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
  # delete and deletecollection are required only for 'patronictl remove'
  - delete
  - deletecollection
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - patch
  - update
  # the following three privileges are necessary only when using endpoints
  - create
  - list
  - watch
  # delete and deletecollection are required only for for 'patronictl remove'
  - delete
  - deletecollection
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - update
  - watch
# The following privilege is only necessary for creation of headless service
# for patronidemo-config endpoint, in order to prevent cleaning it up by the
# k8s master. You can avoid giving this privilege by explicitly creating the
# service like it is done in this manifest (lines 2..10)
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patronidemo-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patronidemo-backup
subjects:
- kind: ServiceAccount
  name: patronidemo-backup

# Following privileges are only required if deployed not in the "default"
# namespace and you want Patroni to bypass kubernetes service
# (PATRONI_KUBERNETES_BYPASS_API_SERVICE=true)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patroni-k8s-ep-access-backup
rules:
- apiGroups:
  - ""
  resources:
  - endpoints
  resourceNames:
  - kubernetes
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: patroni-k8s-ep-access-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: patroni-k8s-ep-access-backup
subjects:
- kind: ServiceAccount
  name: patronidemo
# The namespace must be specified explicitly.
# If deploying to the different namespace you have to change it.
  namespace: default
