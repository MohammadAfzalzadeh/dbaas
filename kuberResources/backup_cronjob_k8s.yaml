apiVersion: v1
kind: ServiceAccount
metadata:
  name: exec-script-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-exec-binding
subjects:
- kind: ServiceAccount
  name: exec-script-sa
roleRef:
  kind: Role
  name: pod-exec-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-script
data:
  script.sh: |
    #!/bin/bash
    /wal-g/wal-g backup-push  /home/postgres/pgdata/pgroot/data --config /wal-g-credentials/.walg.env 

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: exec-script-cronjob
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec: 
      backoffLimit: 1
      template:
        spec:
          containers:
          - name: exec-script
            image: bitnami/kubectl:latest
            imagePullPolicy: Never
            command:
            - /bin/bash
            - -c
            - |
              #!/bin/bash
              SCRIPT_PATH="/scripts/script.sh"

              pods=$(kubectl get pods -l "${LABEL_SELECTOR}" -o jsonpath='{.items[*].metadata.name}')
              for pod in $pods; do
                echo "Running script in pod: $pod"
                kubectl exec $pod -c $CONTAINER_NAME -- bash -c "$(cat $SCRIPT_PATH)"
              done
            volumeMounts:
            - name: script-volume
              mountPath: /scripts
            env: 
            - name: LABEL_SELECTOR
              value: 'application=patroni,role=primary'

            - name: CONTAINER_NAME
              value: 'patronidemo'

          restartPolicy: OnFailure
          serviceAccountName: exec-script-sa
          volumes:
          - name: script-volume
            configMap:
              name: my-script
  

