# Legacy manual path; provision referenced Secrets before use. See docs/security/secrets-management.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exec-script-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-role
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/exec
  verbs:
  - get
  - list
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-exec-binding
subjects:
- kind: ServiceAccount
  name: exec-script-sa
roleRef:
  kind: Role
  name: pod-exec-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-script
data:
  script.sh: "#!/bin/bash\n/wal-g/wal-g backup-push  /home/postgres/pgdata/pgroot/data\
    \ --config /wal-g-credentials/.walg.env \n"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: exec-script-cronjob
spec:
  schedule: 0 0 * * *
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          containers:
          - name: exec-script
            image: dbaas/kubectl:1.30.0
            imagePullPolicy: Never
            command:
            - /bin/bash
            - -c
            - "#!/bin/bash\nSCRIPT_PATH=\"/scripts/script.sh\"\n\npods=$(kubectl get\
              \ pods -l \"${LABEL_SELECTOR}\" -o jsonpath='{.items[*].metadata.name}')\n\
              for pod in $pods; do\n  echo \"Running script in pod: $pod\"\n  kubectl\
              \ exec $pod -c $CONTAINER_NAME -- bash -c \"$(cat $SCRIPT_PATH)\"\n\
              done\n"
            volumeMounts:
            - name: script-volume
              mountPath: /scripts
            env:
            - name: LABEL_SELECTOR
              value: application=patroni,role=primary
            - name: CONTAINER_NAME
              value: patronidemo
          restartPolicy: OnFailure
          serviceAccountName: exec-script-sa
          volumes:
          - name: script-volume
            configMap:
              name: my-script
