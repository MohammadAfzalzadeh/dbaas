# Legacy manual path; provision referenced Secrets before use. See docs/security/secrets-management.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: dbaas/minio:RELEASE.2025-04-22T22-12-26Z
        imagePullPolicy: Never
        args:
        - server
        - /data
        - --console-address
        - :9001
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  ports:
  - port: 9000
    name: api
  - port: 9001
    name: console
  clusterIP: None
  selector:
    app: minio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: init-minio-scripts
data:
  init-minio.sh: '#!/bin/sh

    set -eu

    mc alias set myminio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
    >/dev/null

    mc admin user add myminio "$MINIO_BACKUP_USER" "$MINIO_BACKUP_PASSWORD" >/dev/null

    mc mb "myminio/$MINIO_BACKUP_BUCKET" --ignore-existing >/dev/null

    mc admin policy attach myminio readwrite --user "$MINIO_BACKUP_USER" >/dev/null

    '
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-minio-job
spec:
  template:
    spec:
      containers:
      - name: init-minio
        image: dbaas/mc:RELEASE.2025-04-16T18-13-26Z
        command:
        - /bin/sh
        - -c
        args:
        - sh /scripts/init-minio.sh
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
        - name: MINIO_BACKUP_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: backup-user
        - name: MINIO_BACKUP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: backup-password
        - name: MINIO_BACKUP_BUCKET
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: backup-bucket
      restartPolicy: OnFailure
      volumes:
      - name: script-volume
        configMap:
          name: init-minio-scripts
