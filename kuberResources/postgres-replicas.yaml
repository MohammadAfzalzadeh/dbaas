apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replicas
spec:
  serviceName: "postgres-replicas"
  replicas: 3
  selector:
    matchLabels:
      app: postgres-replica
  template:
    metadata:
      labels:
        app: postgres-replica
    spec:
      containers:
        - name: dbaas-postgres-sync-replica
          image: dbaas-postgres_sync_replica:latest
          imagePullPolicy: Never  # Force Kubernetes to use the locally loaded image
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
          volumeMounts:
            - mountPath: "/var/lib/postgresql/data"
              name: postgres-storage
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-replica-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replicas
spec:
  selector:
    app: postgres-replica
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
