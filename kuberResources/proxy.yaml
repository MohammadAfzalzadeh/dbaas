# Legacy manual path; provision referenced Secrets before use. See docs/security/secrets-management.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-deployment
  labels:
    app: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
      - name: proxy
        image: ghcr.io/postgresml/pgcat:v1.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - name: pgcat-data
          mountPath: /etc/pgcat
      - name: pgcat-config-watcher
        image: dbaas/pgcat-config-watcher:1.1.1
        imagePullPolicy: IfNotPresent
        env:
        - name: PGCAT_CONFIG_SOURCE
          value: /config/pgcat.yaml
        - name: PGCAT_CONFIG_DEST
          value: /etc/pgcat/pgcat.toml
        volumeMounts:
        - name: pgcat-config
          mountPath: /config
          readOnly: true
        - name: pgcat-data
          mountPath: /etc/pgcat
      volumes:
      - name: pgcat-config
        secret:
          secretName: pgcat-config
      - name: pgcat-data
        emptyDir: {}
