postgres:
  imageName: dbaas/patroni:2.1.0
  imagePullPolicy: IfNotPresent
  pg_port: 5432
  patroni_port: 8008
  SUPERUSER_USERNAME: postgres
  SUPERUSER_PASSWORD: ''
  REPLICATION_USERNAME: standby
  REPLICATION_PASSWORD: ''
  BACKUP_ENABLE: false
  storageCapacity: 5Gi
  storageClass: standard
  DATABASE: postgres
  replicaCount: 2
  existingSecret: ''
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits: {}
  scheduling:
    antiAffinity: preferred
    topologyKey: kubernetes.io/hostname
    nodeSelector: &id001 {}
    tolerations: &id002 []
    affinity: &id003 {}
    topologySpreadConstraints: &id004 []
  terminationGracePeriodSeconds: 180
  updateStrategy: OnDelete
  accessModes:
  - ReadWriteOnce
  explicitRetainPolicy: false
  startupProbe:
    enabled: true
    failureThreshold: 360
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    enabled: false
    failureThreshold: 6
    periodSeconds: 10
    timeoutSeconds: 5
  pdb:
    enabled: true
  initDbConfig: 
    databases:
      - name: mmm
        poolMode: session
        primaryReadMode: false
      - name: app
        poolMode: transaction
        primaryReadMode: false

    users:
      - username: test
        password: "123"
        connectionLimit: 10
        validUntil: "2025-08-21"
      - username: app
        password: "123"
        connectionLimit: null
        validUntil: ""

    databaseAccess:
      - username: test
        database: mmm
        accessLevel: admin
        maxConnections: 10
      - username: test
        database: app
        accessLevel: write
        maxConnections: null
      - username: app
        database: app
        accessLevel: read
        maxConnections: null
walg:
  archiveEnabled: true
  # Disable after isolated bootstrap: source timelines can diverge from this clone.
  restoreEnabled: true
  imageName: dbaas/wal-g:3.0.7
  imagePullPolicy: IfNotPresent
  AWS_ACCESS_KEY_ID: ''
  AWS_SECRET_ACCESS_KEY: ''
  WALG_S3_PREFIX: s3://backup
  AWS_REGION: UnitedStates
  WALG_COMPRESSION_METHOD: brotli
  AWS_ENDPOINT: http://minio-mvp-minio:9000
  AWS_S3_FORCE_PATH_STYLE: true
  existingSecret: ''
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits: {}
backup:
  enabled: true
  BACKUP_PERIOD: 0 0 * * *
  IMAGE_NAME: dbaas/kubectl:1.30.0
  IMAGE_PULL_POLICY: IfNotPresent
  LABEL_SELECTOR: application=patroni,role=primary
  CONTAINER_NAME: patronimvp
  PG_DATA_DIR: /home/postgres/pgdata/pgroot/data
  BACKOFF_LIMIT: 1
  RESTART_POLICY: OnFailure
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  activeDeadlineSeconds: 21600
  remoteTimeoutSeconds: 21000
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits: {}
  scheduling:
    antiAffinity: none
    topologyKey: kubernetes.io/hostname
    nodeSelector: *id001
    tolerations: *id002
    affinity: *id003
    topologySpreadConstraints: *id004
kubernetes:
  bypassApiService: false
security:
  allowInlineSecrets: false
networkPolicy:
  enabled: false
  ingress: []
  egress: []
