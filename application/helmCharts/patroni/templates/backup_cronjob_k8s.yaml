{{- if .Values.backup.enabled }}
{{- if ge (int .Values.backup.remoteTimeoutSeconds) (sub (int .Values.backup.activeDeadlineSeconds) 60) }}{{ fail "backup activeDeadlineSeconds must exceed remoteTimeoutSeconds by more than 60 seconds" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-exec-script-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-pod-exec-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-pod-exec-binding
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-exec-script-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-pod-exec-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-my-script
data:
  script.sh: |
    #!/bin/bash
    set -euo pipefail
    [[ "$(PGPASSWORD="$PATRONI_SUPERUSER_PASSWORD" psql -h 127.0.0.1 -U "$PATRONI_SUPERUSER_USERNAME" -d postgres -Atqc 'SELECT pg_is_in_recovery()')" == "f" ]] || { echo "Target is not primary" >&2; exit 1; }
    exec timeout --signal=TERM --kill-after=60s {{ .Values.backup.remoteTimeoutSeconds }}s /wal-g/wal-g backup-push {{ .Values.backup.PG_DATA_DIR | quote }} --config /wal-g-credentials/.walg.env

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-exec-script-cronjob
spec:
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
  schedule: {{ .Values.backup.BACKUP_PERIOD | quote }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ .Values.backup.ttlSecondsAfterFinished }}
      backoffLimit: {{ .Values.backup.BACKOFF_LIMIT }}
      template:
        metadata:
          labels:
            release-name: {{ .Release.Name }}
            app: backup
        spec:
          {{- include "dbaas.scheduling" (dict "settings" .Values.backup.scheduling "labels" (dict "app" "backup" "release-name" .Release.Name)) | nindent 10 }}
          containers:
          - name: backup
            resources: {{ toYaml .Values.backup.resources | nindent 14 }}
            image: {{ .Values.backup.IMAGE_NAME }}
            imagePullPolicy: {{ .Values.backup.IMAGE_PULL_POLICY }}
            command:
            - /bin/bash
            - -c
            - |
              #!/bin/bash
              set -euo pipefail
              : "${LABEL_SELECTOR:?LABEL_SELECTOR is required}"
              pods=$(kubectl get pods -n "$POD_NAMESPACE" -l "$LABEL_SELECTOR" -o jsonpath='{.items[*].metadata.name}')
              read -r -a targets <<< "$pods"
              if [[ ${#targets[@]} -ne 1 ]]; then
                echo "Expected exactly one primary for $LABEL_SELECTOR; found ${#targets[@]}" >&2
                exit 1
              fi
              target="${targets[0]}"
              echo "Backing up PostgreSQL target $POD_NAMESPACE/$target"
              kubectl exec -i -n "$POD_NAMESPACE" "$target" -c "$CONTAINER_NAME" -- bash -s < /scripts/script.sh
              echo "Backup command completed for $POD_NAMESPACE/$target"
            volumeMounts:
            - name: script-volume
              mountPath: /scripts
            env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LABEL_SELECTOR
              value: {{ printf "%s,application=patroni,role=primary,cluster-name=%s-patronimvp,release-name=%s" (required "backup.LABEL_SELECTOR is required" .Values.backup.LABEL_SELECTOR) .Release.Name .Release.Name | quote }}

            - name: CONTAINER_NAME
              value: '{{ .Values.backup.CONTAINER_NAME }}'

          restartPolicy: {{ .Values.backup.RESTART_POLICY }}
          serviceAccountName: {{ .Release.Name }}-exec-script-sa
          volumes:
          - name: script-volume
            configMap:
              name: {{ .Release.Name }}-my-script



{{- end }}
