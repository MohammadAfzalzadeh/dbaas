replicaCount: 1
imagePullPolicy: IfNotPresent
pgcatImageName: ghcr.io/postgresml/pgcat:v1.2.0
pgcatConfigWatcherImageName: dbaas/pgcat-config-watcher:1.1.1
patroniReleaseName: patroni-mvp
pgcatconfig:
  general:
    PGCAT_PORT: '5432'
    PGCAT_SUPERUSER_USERNAME: postgres
    PGCAT_SUPERUSER_PASSWORD: ''
    ENABLE_PROMETHEUS: true
    PROMETHEUS_EXPORTER_PORT: 9930
  DBS:
  - NAME: postgres
    POOL_MODE: session
    PRIMARY_READ: false
    SHARDING_FUNCTION: pg_bigint_hash
    users:
    - USER_NAME: postgres
      PASSWORD: ''
      POOL_SIZE: 9
      STATEMENT_TIMEOUT: 0
    shards:
    - MASTER_HOST: ''
      MASTER_PORT: '5432'
      REPLICA_HOST: ''
      REPLICA_PORT: '5432'
pgadmin:
  email: admin@example.com
  pass: ''
  existingSecret: ''
pgadminIngress:
  enabled: false
  host: ''
security:
  allowInlineSecrets: false
existingSecret: ''
