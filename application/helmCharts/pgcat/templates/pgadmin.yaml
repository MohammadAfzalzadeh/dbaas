{{- $secret := default (printf "%s-pgadmin" .Release.Name) .Values.pgadmin.existingSecret -}}
{{- if and .Values.security.allowInlineSecrets (not .Values.pgadmin.existingSecret) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
 name: {{ $secret }}
stringData:
  pgadmin-password: {{ required "development mode requires pgadmin.pass" .Values.pgadmin.pass | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
 name: {{ .Release.Name }}-pgadmin-config
data:
 servers.json: |
   {
       "Servers": {
         "1": {
           "Name": "PostgreSQL DB Master",
           "Group": "Servers",
           "Port": 5432,
           "Username": "postgres",
           "Host": "patronimvp-master-{{ .Values.patroniReleaseName }}",
           "SSLMode": "prefer",
           "MaintenanceDB": "postgres"
         },
         "2": {
           "Name": "PostgreSQL DB Replica",
           "Group": "Servers",
           "Port": 5432,
           "Username": "postgres",
           "Host": "patronimvp-replica-{{ .Values.patroniReleaseName }}",
           "SSLMode": "prefer",
           "MaintenanceDB": "postgres"
         },
         "3": {
           "Name": "PostgreSQL DB Pgcat",
           "Group": "Servers",
           "Port": 5432,
           "Username": "postgres",
           "Host": "{{ .Release.Name }}-proxy-service",
           "SSLMode": "prefer",
           "MaintenanceDB": "postgres"
         }
       }
   }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgadmin-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
      release-name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: pgadmin
        release-name: {{ .Release.Name }}
    spec:
      {{- include "dbaas.scheduling" (dict "settings" .Values.pgadmin.scheduling "labels" (dict "app" "pgadmin" "release-name" .Release.Name)) | nindent 6 }}
      containers:
        - name: {{ $secret }}
          image: dpage/pgadmin4:9.3
          resources: {{ toYaml .Values.pgadmin.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /misc/ping, port: 80}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /misc/ping, port: 80}
            timeoutSeconds: 5
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: {{ .Values.pgadmin.email | quote }}
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: pgadmin-password
          volumeMounts:
          - name: {{ .Release.Name }}-pgadmin-config
            mountPath: /pgadmin4/servers.json
            subPath: servers.json
            readOnly: true
      volumes:
      - name: {{ .Release.Name }}-pgadmin-config
        configMap:
          name: {{ .Release.Name }}-pgadmin-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pgadmin-service
spec:
  selector:
    app: pgadmin
    release-name: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
{{- if .Values.pgadminIngress.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name:  {{ .Release.Name }}-pgadmin
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`{{ required "pgadminIngress.host is required when enabled" .Values.pgadminIngress.host }}`)
    kind: Rule
    services:
    - name:  {{ .Release.Name }}-pgadmin-service
      port: 80

{{- end }}
