{{- $pgSecret := default (printf "%s-postgres-credentials" .Release.Name) .Values.postgres.existingSecret -}}
{{- $walgSecret := default (printf "%s-wal-g-credentials" .Release.Name) .Values.walg.existingSecret -}}
# headless service to avoid deletion of patronimvp-config endpoint
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-patronimvp-config
  labels:
    application: patroni
    cluster-name: patronimvp
    release-name: {{ .Release.Name }}
spec:
  clusterIP: None
---
{{- if and .Values.security.allowInlineSecrets (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgSecret }}
type: Opaque
stringData:
  superuser-username: {{ .Values.postgres.SUPERUSER_USERNAME | quote }}
  superuser-password: {{ required "development mode requires postgres.SUPERUSER_PASSWORD" .Values.postgres.SUPERUSER_PASSWORD | quote }}
  replication-username: {{ .Values.postgres.REPLICATION_USERNAME | quote }}
  replication-password: {{ required "development mode requires postgres.REPLICATION_PASSWORD" .Values.postgres.REPLICATION_PASSWORD | quote }}
---
{{- end }}
{{- if and .Values.security.allowInlineSecrets (not .Values.walg.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $walgSecret }}
type: Opaque
stringData:
  .walg.env: |
    PGHOST=localhost
    PGPORT={{ .Values.postgres.pg_port }}
    PGUSER={{ .Values.postgres.SUPERUSER_USERNAME }}
    PGPASSWORD={{ .Values.postgres.SUPERUSER_PASSWORD | quote }}
    PGDATABASE={{ .Values.postgres.DATABASE }}

    AWS_ACCESS_KEY_ID={{ .Values.walg.AWS_ACCESS_KEY_ID | quote }}
    AWS_SECRET_ACCESS_KEY={{ .Values.walg.AWS_SECRET_ACCESS_KEY | quote }}
    WALG_S3_PREFIX={{ .Values.walg.WALG_S3_PREFIX }}
    AWS_REGION={{ .Values.walg.AWS_REGION }}
    WALG_COMPRESSION_METHOD={{ .Values.walg.WALG_COMPRESSION_METHOD }}
    AWS_ENDPOINT={{ .Values.walg.AWS_ENDPOINT }}
    AWS_S3_FORCE_PATH_STYLE={{ .Values.walg.AWS_S3_FORCE_PATH_STYLE }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-patronimvp
  labels:
    application: patroni
    cluster-name: patronimvp
    release-name: {{ .Release.Name }}
spec:
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: {{ .Values.postgres.updateStrategy }}
  {{- if .Values.postgres.explicitRetainPolicy }}
  {{- if not (semverCompare ">=1.27-0" .Capabilities.KubeVersion.Version) }}{{ fail "Explicit PVC retention requires Kubernetes >=1.27" }}{{ end }}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  {{- end }}
  replicas: {{ .Values.postgres.replicaCount }}
  serviceName: {{ .Release.Name }}-patronimvp
  selector:
    matchLabels:
      application: patroni
      cluster-name: {{ .Release.Name }}-patronimvp
      release-name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        application: patroni
        cluster-name: {{ .Release.Name }}-patronimvp
        release-name: {{ .Release.Name }}
    spec:
      {{- include "dbaas.scheduling" (dict "settings" .Values.postgres.scheduling "labels" (dict "application" "patroni" "release-name" .Release.Name "cluster-name" (printf "%s-patronimvp" .Release.Name))) | nindent 6 }}
      serviceAccountName: {{ .Release.Name }}-patronimvp
      securityContext:
        fsGroup: 999
      initContainers:
      - name: wal-g
        image: {{ .Values.walg.imageName }}
        imagePullPolicy: {{ .Values.walg.imagePullPolicy }}
        resources: {{ toYaml .Values.walg.resources | nindent 10 }}
        volumeMounts:
        - name: wal-g-bin
          mountPath: /usr/local/bin
        command: ["/bin/sh", "-c" ]
        args:
        - |
          set -eu
          cp wal-g-pg-ubuntu-20.04-amd64 /usr/local/bin/wal-g
          chmod +x /usr/local/bin/wal-g
          mkdir -p /usr/local/bin/commands
          cat > /usr/local/bin/commands/restore_backup.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          PGDATA="${1:?data directory required}"
          [[ "${2:-false}" == "true" ]] || exit 1
          : "${BASE_BACKUP_NAME:?backup name required for restore}"
          echo "Fetching selected WAL-G base backup: $BASE_BACKUP_NAME"
          exec /wal-g/wal-g backup-fetch "$PGDATA" "$BASE_BACKUP_NAME" --config /wal-g-credentials/.walg.env
          EOF
          chmod +x /usr/local/bin/commands/restore_backup.sh
      containers:
      - name: patronimvp
        image: {{ .Values.postgres.imageName }}
        imagePullPolicy: {{ .Values.postgres.imagePullPolicy }}
        resources: {{ toYaml .Values.postgres.resources | nindent 10 }}
        {{- if .Values.postgres.startupProbe.enabled }}
        startupProbe:
          httpGet: {path: /health, port: {{ .Values.postgres.patroni_port }}}
          {{- toYaml (omit .Values.postgres.startupProbe "enabled") | nindent 10 }}
        {{- end }}
        {{- if .Values.postgres.livenessProbe.enabled }}
        livenessProbe:
          httpGet: {path: /liveness, port: {{ .Values.postgres.patroni_port }}}
          {{- toYaml (omit .Values.postgres.livenessProbe "enabled") | nindent 10 }}
        {{- end }}
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /read-only
            port: {{ .Values.postgres.patroni_port }}
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        ports:
        - containerPort: {{ .Values.postgres.pg_port }}
          protocol: TCP
        - containerPort: {{ .Values.postgres.patroni_port }}
          protocol: TCP
        volumeMounts:
        - name: pgdata
          mountPath: /home/postgres/pgdata/pgroot/
        - name: wal-g-bin
          mountPath: /wal-g
        - name: wal-g-credentials
          mountPath: /wal-g-credentials
        env:
        - name: PATRONI_KUBERNETES_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PATRONI_KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PATRONI_KUBERNETES_BYPASS_API_SERVICE
          value: {{ .Values.kubernetes.bypassApiService | quote }}
        - name: PATRONI_KUBERNETES_USE_ENDPOINTS
          value: 'true'
        - name: PATRONI_KUBERNETES_LABELS
          # value: '{{ dict "application" "patroni" "cluster-name" "patronimvp" "release-name" .Release.Name | toJson }}'
          value: '{{ dict "application" "patroni" "cluster-name" (printf "%s-patronimvp" .Release.Name) "release-name" .Release.Name | toJson }}'
        - name: PATRONI_SUPERUSER_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecret }}
              key: superuser-username
        - name: PATRONI_SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecret }}
              key: superuser-password
        - name: PATRONI_REPLICATION_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecret }}
              key: replication-username
        - name: PATRONI_REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecret }}
              key: replication-password
        - name: PATRONI_SCOPE
          value: {{ .Release.Name }}-patronimvp
        - name: PATRONI_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PATRONI_POSTGRESQL_DATA_DIR
          value: /home/postgres/pgdata/pgroot/data
        - name: PATRONI_POSTGRESQL_PGPASS
          value: /tmp/pgpass
        - name: PATRONI_POSTGRESQL_LISTEN
          value: '0.0.0.0:{{ .Values.postgres.pg_port }}'
        - name: PATRONI_RESTAPI_LISTEN
          value: '0.0.0.0:{{ .Values.postgres.patroni_port }}'

        # PostgreSQL archiving
        - name: PATRONI_POSTGRESQL_PARAMETERS
          value: |
            wal_level: replica
            archive_mode: {{ ternary "on" "off" .Values.walg.archiveEnabled }}
            archive_timeout: 60
            archive_command: '/wal-g/wal-g wal-push  --config /wal-g-credentials/.walg.env %p'
            restore_command: '{{ if .Values.walg.restoreEnabled }}/wal-g/wal-g wal-fetch --config /wal-g-credentials/.walg.env %f %p{{ end }}'

        - name: BACKUP_ENABLE
          value: {{ .Values.postgres.BACKUP_ENABLE | quote}}

        - name: BASE_BACKUP_NAME
          value: {{ .Values.postgres.BASE_BACKUP_NAME | default "LATEST" | quote }}

        - name: RECOVERY_TARGET_TIME
          value: {{ .Values.postgres.RECOVERY_TARGET_TIME | default "" | quote }}

      terminationGracePeriodSeconds: {{ .Values.postgres.terminationGracePeriodSeconds }}
      volumes:
      - name: wal-g-bin
        emptyDir: {}
      - name: wal-g-credentials
        secret:
          secretName: {{ $walgSecret }}
  volumeClaimTemplates:
  - metadata:
      labels:
        application: spilo
        spilo-cluster: patronimvp
      annotations:
        volume.alpha.kubernetes.io/storage-class: {{ .Values.postgres.storageClass }}
      name: pgdata
    spec:
      storageClassName: {{ .Values.postgres.storageClass }}
      accessModes: {{ toYaml .Values.postgres.accessModes | nindent 8 }}
      resources:
        requests:
          storage: {{ .Values.postgres.storageCapacity }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-patronimvp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-patronimvp
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
  # delete and deletecollection are required only for 'patronictl remove'
  - delete
  - deletecollection
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - patch
  - update
  # the following three privileges are necessary only when using endpoints
  - create
  - list
  - watch
  # delete and deletecollection are required only for for 'patronictl remove'
  - delete
  - deletecollection
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - update
  - watch
# The following privilege is only necessary for creation of headless service
# for patronimvp-config endpoint, in order to prevent cleaning it up by the
# k8s master. You can avoid giving this privilege by explicitly creating the
# service like it is done in this manifest (lines 2..10)
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-patronimvp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-patronimvp
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-patronimvp
  namespace: {{ .Release.Namespace }}

{{- if .Values.kubernetes.bypassApiService }}
# Following privileges are only required if deployed not in the "default"
# namespace and you want Patroni to bypass kubernetes service
# (PATRONI_KUBERNETES_BYPASS_API_SERVICE=true)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patroni-k8s-ep-{{ printf "%s-%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 }}
rules:
- apiGroups:
  - ""
  resources:
  - endpoints
  resourceNames:
  - kubernetes
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: patroni-k8s-ep-{{ printf "%s-%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: patroni-k8s-ep-{{ printf "%s-%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 }}
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-patronimvp
# The namespace must be specified explicitly.
# If deploying to the different namespace you have to change it.
  namespace: {{ .Release.Namespace }}

{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-patronimvp
spec:
  clusterIP: None
  # Patroni owns the same-name leader Endpoints. A selector would let the
  # Kubernetes Endpoints controller overwrite Patroni's primary address.
  ports:
  - name: pg
    port: {{ .Values.postgres.pg_port }}
    targetPort: {{ .Values.postgres.pg_port }}
