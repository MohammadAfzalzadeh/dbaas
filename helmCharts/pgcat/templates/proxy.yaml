{{- $secret := default (printf "%s-pgcat-config" .Release.Name) .Values.existingSecret -}}
{{- $config := deepCopy .Values.pgcatconfig -}}
{{- $patroni := required "patroniReleaseName is required" .Values.patroniReleaseName -}}
{{- if not $config.DBS -}}{{ fail "pgcatconfig.DBS must contain at least one database" }}{{- end -}}
{{- range $db := $config.DBS -}}
{{- if not $db.users -}}{{ fail "Each PgCat database requires at least one user" }}{{- end -}}
{{- range $shard := $db.shards -}}
{{- if not $shard.MASTER_HOST -}}{{- $_ := set $shard "MASTER_HOST" (printf "patronimvp-master-%s" $patroni) -}}{{- end -}}
{{- if and (not $shard.REPLICA_HOST) (or (not (hasKey $shard "INCLUDE_REPLICA")) $shard.INCLUDE_REPLICA) -}}{{- $_ := set $shard "REPLICA_HOST" (printf "patronimvp-replica-%s" $patroni) -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.security.allowInlineSecrets (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
type: Opaque
stringData:
  pgcat.yaml: |
{{ $config | toYaml | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-proxy-deployment
  labels:
    app: proxy
    release-name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: proxy
      release-name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: proxy
        release-name: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "dbaas.scheduling" (dict "settings" .Values.scheduling "labels" (dict "app" "proxy" "release-name" .Release.Name)) | nindent 6 }}
      initContainers:
        - name: pgcat-config-init
          image: {{ .Values.pgcatConfigWatcherImageName }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources: {{ toYaml .Values.watcherResources | nindent 12 }}
          command: ["node", "pgcat-config-watcher.js", "--once"]
          volumeMounts:
            - name: pgcat-config
              mountPath: /config
              readOnly: true
            - name: pgcat-data
              mountPath: /etc/pgcat
      containers:
        - name: proxy
          image: {{ .Values.pgcatImageName }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          ports:
            - name: postgres
              containerPort: {{ .Values.pgcatconfig.general.PGCAT_PORT | int }}
              protocol: TCP
            {{- if .Values.pgcatconfig.general.ENABLE_PROMETHEUS }}
            - name: metrics
              containerPort: {{ .Values.pgcatconfig.general.PROMETHEUS_EXPORTER_PORT | int }}
            {{- end }}
          volumeMounts:
            - name: pgcat-data
              mountPath: /etc/pgcat
        - name: pgcat-config-watcher
          image: {{ .Values.pgcatConfigWatcherImageName }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources: {{ toYaml .Values.watcherResources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["node", "pgcat-health.js"]
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          env:
            - name: PGCAT_CONFIG_SOURCE
              value: "/config/pgcat.yaml"
            - name: PGCAT_CONFIG_DEST
              value: "/etc/pgcat/pgcat.toml"
          volumeMounts:
            - name: pgcat-config
              mountPath: /config  # Read-only source
              readOnly: true
            - name: pgcat-data
              mountPath: /etc/pgcat # Writable target
      volumes:
        - name: pgcat-config
          secret:
            secretName: {{ $secret }}
            items:
              - key: pgcat.yaml
                path: pgcat.yaml
        - name: pgcat-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-proxy-service
  labels:
    application: pgcat
    type: monitoring
    app: proxy
    release-name: {{ .Release.Name }}
spec:
  ports:
    - name: pgcat
      port: 5432
      targetPort: postgres
      protocol: TCP
    {{- if .Values.pgcatconfig.general.ENABLE_PROMETHEUS }}
    - name: metrics
      port: {{ .Values.pgcatconfig.general.PROMETHEUS_EXPORTER_PORT | int }}
      targetPort: metrics
    {{- end }}
  selector:
    app: proxy
    release-name: {{ .Release.Name }}


