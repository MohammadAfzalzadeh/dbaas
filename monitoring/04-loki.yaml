deploymentMode: SimpleScalable
global:
  dnsService: kube-dns #coredns
# MinIO داخلی (برای تولید کوچک و متوسط عالیه)
minio:
  enabled: false
  persistence:
    storageClass: standard
    size: 1Gi

# ←←← این بخش جدید اضافه شد (schema + bucketNames)
loki:
  commonConfig:
    replication_factor: 1 #2
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    type: s3
    s3:
      endpoint: minio.monitoring.svc:9000
      insecure: true
      accessKeyId: loki
      secretAccessKey: supersecret

# Longhorn برای همه بخش‌ها
backend:
  replicas: 1 #3
  persistence:
    storageClass: standard
    size: 1Gi
read:
  replicas: 1 #2
  persistence:
    storageClass: standard
    size: 1Gi
write:
  replicas: 1 #2
  persistence:
    storageClass: standard
    size: 1Gi

chunksCache:
  enabled: true
  allocatedMemory: 1024
  resources:
    requests:
      cpu: 100m
      memory: 1200Mi
    limits:
      cpu: 500m
      memory: 1500Mi
